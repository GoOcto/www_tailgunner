		<button id="hyperjump">Hyperjump</button>

//import jsfxr from "jsfxr";
import { sfxr } from "jsfxr";
import { sfxBlaster, sfxBounce, sfxExplode, sfxHyperjump, sfxShield } from "./src/Sounds.js";

let shieldSoundWave = null;
let activeShieldSound = null;

let audioCtx = null;
let fxShieldWav = null;

window.onload = () => {
	fxShieldWav = sfxr.toAudio(sfxShield);
	audioCtx = new AudioContext();
};

document.getElementById("blaster").addEventListener("click", () => {
	sfxr.toAudio(sfxBlaster).play();
});
document.getElementById("bounce").addEventListener("click", () => {
	sfxr.toAudio(sfxBounce).play();
});
document.getElementById("explode").addEventListener("click", () => {
	sfxr.toAudio(sfxExplode).play();
});
document.getElementById("hyperjump").addEventListener("click", () => {
	sfxr.toAudio(sfxHyperjump).play();
});

document.getElementById("shield").addEventListener("mousedown", () => {
    if (!activeShieldSound) {
        activeShieldSound = sfxr.toAudio(sfxShield); 
        activeShieldSound.loop = true; // Loop the audio infinitely
        activeShieldSound.play();      // Start playback
    }
});

document.getElementById("shield").addEventListener("mouseup", () => {
    if (activeShieldSound) {
        activeShieldSound.pause();         // Stop playback
        activeShieldSound.currentTime = 0; // Reset to the beginning
        activeShieldSound = null;
    }
});
